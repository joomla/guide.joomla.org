; Playground Tour module

MOD_PLAYGROUNDTOUR="Playground Tour"
MOD_PLAYGROUNDTOUR_XML_DESCRIPTION="Shows the guided tour of a Joomla User Guide tutorial: a screenshot with a play button that opens a Joomla Playground with the tour, in the language of the page."
MOD_PLAYGROUNDTOUR_FIELD_TOUR_LABEL="Tour"
MOD_PLAYGROUNDTOUR_FIELD_TOUR_DESC="Automatic: the tour of the tutorial on the page, found by the page's path in any language; on other pages the module shows nothing, so it can be assigned to all pages."
MOD_PLAYGROUNDTOUR_FIELD_TOUR_AUTO="Automatic (the tutorial of the page)"
MOD_PLAYGROUNDTOUR_FIELD_DISPLAY_LABEL="Display"
MOD_PLAYGROUNDTOUR_FIELD_DISPLAY_POSTER="Screenshot with a play button"
MOD_PLAYGROUNDTOUR_FIELD_DISPLAY_BUTTON="Button"
MOD_PLAYGROUNDTOUR_FIELD_PLAYGROUND_LABEL="Playground"
MOD_PLAYGROUNDTOUR_FIELD_PLAYGROUND_DESC="The address of the Joomla Playground."
MOD_PLAYGROUNDTOUR_FIELD_BLUEPRINTS_LABEL="Blueprints"
MOD_PLAYGROUNDTOUR_FIELD_BLUEPRINTS_DESC="Where the Playground finds the tours' blueprints: a path on the Playground's site, or a full address such as a raw.githubusercontent.com folder. The module adds /<language>/<tour>.json."
